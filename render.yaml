services:
  - type: web
    name: ferie-synlab
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Il server deve ascoltare su tutte le interfacce: la porta arriva da PORT.
      - key: HOST
        value: 0.0.0.0
